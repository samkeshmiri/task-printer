<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Printer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 Task Printer</h1>
      <p>Enter task and print instantly</p>
    </header>

    <main>
      <section class="print-section">
        <div class="print-form">
          <input 
            type="text" 
            id="taskInput" 
            placeholder="Enter task to print..." 
            autocomplete="off"
          >
          <button id="printBtn" class="btn btn-primary">🖨️ Print</button>
        </div>
        <div id="status" class="status-message"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
